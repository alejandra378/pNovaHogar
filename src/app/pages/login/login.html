<div class="auth-container">
  <div class="auth-card">
    <h1>Inicio de sesión</h1>
    <p class="subtitulo">Accede a tu cuenta de NovaHogar.</p>

    <form (ngSubmit)="entrar()">
      <label>Correo electrónico</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="ejemplo@correo.com"
      />

      <label>Contraseña</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
      />

      <label>CAPTCHA externo</label>
      <div id="recaptchaLogin" class="recaptcha-box"></div>

      <p class="error" *ngIf="error">{{ error }}</p>
      <p class="mensaje" *ngIf="mensaje">{{ mensaje }}</p>

      <button type="submit">Entrar</button>
    </form>

    <p class="link">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</div>
